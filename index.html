<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>看见音乐</title>
    <meta
      name="description"
      content="看见音乐之美。上传音乐或粘贴音频链接，把声音实时转成光谱圆环、激光厅、光环扫描、声波漩涡等动态视觉。"
    />
    <meta name="theme-color" content="#05070d" />
    <meta property="og:title" content="看见音乐" />
    <meta property="og:description" content="把声音实时翻译成可观看、可录制、可分享的视觉作品。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="看见音乐" />
    <meta name="twitter:description" content="看见音乐之美。把声音转成实时动态视觉。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <span data-i18n="brand">看见音乐</span>
        </div>
        <p id="statusText" class="status-text">选择音乐后即可开始。</p>
        <div class="header-actions">
          <button id="languageButton" class="language-button" type="button">EN</button>
          <button id="immersiveButton" class="immersive-button" type="button" aria-pressed="false">沉浸</button>
        </div>
      </header>

      <section class="stage" aria-label="音乐可视化舞台">
        <canvas id="visualizer" aria-hidden="true"></canvas>
        <div class="empty-state" id="emptyState">
          <h1 data-i18n="heroTitle">看见音乐之美</h1>
        </div>
      </section>

      <aside class="control-panel" aria-label="控制面板">
        <div class="source-stack">
          <label class="upload-button">
            <input id="fileInput" type="file" accept="audio/*" />
            <span data-i18n="chooseMusic">选择音乐</span>
          </label>
          <div class="url-loader">
            <input id="urlInput" type="url" placeholder="粘贴音频直链或视频链接" data-i18n-placeholder="urlPlaceholder" />
            <button id="loadUrlButton" data-i18n="load">读取</button>
          </div>
          <p id="trackName" class="track-name" data-empty-text="还没有选择文件">还没有选择文件</p>
        </div>

        <audio id="audio" controls></audio>

        <div class="progress-control" aria-label="播放进度">
          <span id="currentTimeLabel">0:00</span>
          <input id="seekInput" type="range" min="0" max="1000" step="1" value="0" disabled />
          <span id="durationLabel">0:00</span>
        </div>

        <div class="control-group">
          <div class="segmented" role="group" aria-label="视觉模式">
            <button class="mode-button active" data-mode="ring" data-i18n="modeRing">光谱圆环</button>
            <button class="mode-button" data-mode="tunnel" data-i18n="modeTunnel">波形隧道</button>
            <button class="mode-button" data-mode="curtain" data-i18n="modeCurtain">光幕雕塑</button>
            <button class="mode-button" data-mode="terrain" data-i18n="modeTerrain">声波地貌</button>
            <button class="mode-button" data-mode="laser" data-i18n="modeLaser">激光厅</button>
            <button class="mode-button" data-mode="scanner" data-i18n="modeScanner">光环扫描</button>
            <button class="mode-button" data-mode="vortex" data-i18n="modeVortex">声波漩涡</button>
            <button class="mode-button" data-mode="wireform" data-i18n="modeWireform">线场雕塑</button>
            <button class="mode-button" data-mode="psyfluid" data-i18n="modePsyfluid">迷幻流体</button>
            <button class="mode-button" data-mode="crystal" data-i18n="modeCrystal">晶体星尘</button>
            <button class="mode-button" data-mode="skychamber" data-i18n="modeSkyChamber">光域天窗</button>
          </div>
        </div>

        <div class="control-group">
          <div class="theme-grid" role="group" aria-label="色彩主题">
            <button class="theme-button active" data-theme="aurora"><span class="swatch aurora"></span><span data-i18n="themeAurora">极光</span></button>
            <button class="theme-button" data-theme="ember"><span class="swatch ember"></span><span data-i18n="themeEmber">炽热</span></button>
            <button class="theme-button" data-theme="mono"><span class="swatch mono"></span><span data-i18n="themeMono">黑金</span></button>
          </div>
        </div>

        <div class="control-row">
          <label for="sensitivity"><span data-i18n="sensitivity">灵敏度</span> <span>Intensity</span></label>
          <input id="sensitivity" type="range" min="0.6" max="2.4" step="0.1" value="1.2" />
        </div>

        <div class="metrics" aria-label="实时特征">
          <div class="meters">
            <span><span data-i18n="bass">低频</span> <b id="bassMeter">0</b></span>
            <span><span data-i18n="mid">中频</span> <b id="midMeter">0</b></span>
            <span><span data-i18n="treble">高频</span> <b id="trebleMeter">0</b></span>
            <span><span data-i18n="beat">节拍</span> <b id="beatMeter">0</b></span>
          </div>
        </div>

        <div class="actions">
          <button id="recordButton" class="primary-button" disabled data-i18n="startRecording">开始录制</button>
          <button id="downloadButton" class="download-link" hidden data-i18n="downloadVideo">下载视频</button>
        </div>
      </aside>

      <button id="exitImmersiveButton" class="exit-immersive-button" type="button" hidden data-i18n="showControls">显示控制</button>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
